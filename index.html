<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WS300 Tanı Sayfası</title>
<style>
  body{ background:#0a0d0b; color:#d9e4dc; font-family:sans-serif; padding:20px; font-size:16px; }
  h1{ font-size:18px; }
  button{ font-size:18px; padding:16px 24px; border-radius:10px; border:none; background:#3dffa0; color:#04120a; font-weight:bold; margin:10px 0; display:block; width:100%; }
  #out{ background:#000; border:1px solid #333; border-radius:8px; padding:12px; margin-top:16px; white-space:pre-wrap; word-break:break-word; font-family:monospace; font-size:13px; min-height:200px; }
  .ok{ color:#3dffa0; }
  .err{ color:#ff5d5d; }
  .info{ color:#ffb238; }
</style>
</head>
<body>
<h1>WS300 Tanı Sayfası (harici kaynak yok)</h1>
<button id="btn">1) Test Et — Cihaza Bağlan</button>
<div id="out">Sayfa yüklendi, bekleniyor…</div>

<script>
// Bu sayfa hiçbir CDN/harici kaynak kullanmıyor — tamamen tek dosya.
// Amaç: ana WS300 aracında sorun harici kaynak (Chart.js/Google Fonts)
// engellenmesinden mi kaynaklanıyor, yoksa Web Bluetooth'un kendisi mi
// çalışmıyor, bunu ayırt etmek.

const out = document.getElementById('out');
function p(msg, cls){
  const d = document.createElement('div');
  if(cls) d.className = cls;
  d.textContent = msg;
  out.appendChild(d);
}

p('JavaScript çalışıyor ✓', 'ok');
p('navigator.bluetooth mevcut mu: ' + (!!navigator.bluetooth), navigator.bluetooth ? 'ok' : 'err');
p('Sayfa protokolü: ' + location.protocol, location.protocol==='https:' ? 'ok' : 'err');

document.getElementById('btn').addEventListener('click', async function(){
  p('--- Butona basıldı ---', 'info');
  try{
    if(!navigator.bluetooth){
      p('HATA: navigator.bluetooth tanımsız. Bu tarayıcı/ortam Web Bluetooth desteklemiyor.', 'err');
      alert('navigator.bluetooth tanımsız!');
      return;
    }
    p('requestDevice çağrılıyor…', 'info');
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true
    });
    p('BAŞARILI! Seçilen cihaz: ' + device.name, 'ok');
    alert('Başarılı: ' + device.name);
  }catch(err){
    p('HATA YAKALANDI: ' + err.name + ' — ' + err.message, 'err');
    alert('Hata: ' + err.name + ': ' + err.message);
  }
});
</script>
</body>
</html>
